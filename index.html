<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CSS-only decimal calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <form class="calculator" aria-label="CSS-only decimal calculator">
      <div class="state-bank" aria-hidden="true">
        <input id="mode-entry" type="radio" name="mode" checked />
        <input id="op-none" type="radio" name="operator" checked />

        <input id="a1-empty" type="radio" name="a1" checked />
        <input id="a2-empty" type="radio" name="a2" checked />
        <input id="a3-empty" type="radio" name="a3" checked />
        <input id="b1-empty" type="radio" name="b1" checked />
        <input id="b2-empty" type="radio" name="b2" checked />
        <input id="b3-empty" type="radio" name="b3" checked />
      </div>

      <section class="display" aria-live="polite">
        <div class="brand-row">
          <span>CSS-only</span>
          <span class="screen-state"></span>
        </div>
        <div class="expression">
          <span class="operand operand--a"></span>
          <span class="operator-readout"></span>
          <span class="operand operand--b"></span>
          <span class="equals-readout">=</span>
        </div>
        <output class="main-output" name="result"></output>
      </section>

      <section class="keypad" aria-label="Calculator keys">
        <div class="number-pad">
          <div class="digit-key">
            <label class="digit-proxy digit-proxy--a1"><input id="a1-7" type="radio" name="a1" /><span>7</span></label>
            <label class="digit-proxy digit-proxy--a2"><input id="a2-7" type="radio" name="a2" /><span>7</span></label>
            <label class="digit-proxy digit-proxy--a3"><input id="a3-7" type="radio" name="a3" /><span>7</span></label>
            <label class="digit-proxy digit-proxy--b1"><input id="b1-7" type="radio" name="b1" /><span>7</span></label>
            <label class="digit-proxy digit-proxy--b2"><input id="b2-7" type="radio" name="b2" /><span>7</span></label>
            <label class="digit-proxy digit-proxy--b3"><input id="b3-7" type="radio" name="b3" /><span>7</span></label>
          </div>
          <div class="digit-key">
            <label class="digit-proxy digit-proxy--a1"><input id="a1-8" type="radio" name="a1" /><span>8</span></label>
            <label class="digit-proxy digit-proxy--a2"><input id="a2-8" type="radio" name="a2" /><span>8</span></label>
            <label class="digit-proxy digit-proxy--a3"><input id="a3-8" type="radio" name="a3" /><span>8</span></label>
            <label class="digit-proxy digit-proxy--b1"><input id="b1-8" type="radio" name="b1" /><span>8</span></label>
            <label class="digit-proxy digit-proxy--b2"><input id="b2-8" type="radio" name="b2" /><span>8</span></label>
            <label class="digit-proxy digit-proxy--b3"><input id="b3-8" type="radio" name="b3" /><span>8</span></label>
          </div>
          <div class="digit-key">
            <label class="digit-proxy digit-proxy--a1"><input id="a1-9" type="radio" name="a1" /><span>9</span></label>
            <label class="digit-proxy digit-proxy--a2"><input id="a2-9" type="radio" name="a2" /><span>9</span></label>
            <label class="digit-proxy digit-proxy--a3"><input id="a3-9" type="radio" name="a3" /><span>9</span></label>
            <label class="digit-proxy digit-proxy--b1"><input id="b1-9" type="radio" name="b1" /><span>9</span></label>
            <label class="digit-proxy digit-proxy--b2"><input id="b2-9" type="radio" name="b2" /><span>9</span></label>
            <label class="digit-proxy digit-proxy--b3"><input id="b3-9" type="radio" name="b3" /><span>9</span></label>
          </div>

          <div class="digit-key">
            <label class="digit-proxy digit-proxy--a1"><input id="a1-4" type="radio" name="a1" /><span>4</span></label>
            <label class="digit-proxy digit-proxy--a2"><input id="a2-4" type="radio" name="a2" /><span>4</span></label>
            <label class="digit-proxy digit-proxy--a3"><input id="a3-4" type="radio" name="a3" /><span>4</span></label>
            <label class="digit-proxy digit-proxy--b1"><input id="b1-4" type="radio" name="b1" /><span>4</span></label>
            <label class="digit-proxy digit-proxy--b2"><input id="b2-4" type="radio" name="b2" /><span>4</span></label>
            <label class="digit-proxy digit-proxy--b3"><input id="b3-4" type="radio" name="b3" /><span>4</span></label>
          </div>
          <div class="digit-key">
            <label class="digit-proxy digit-proxy--a1"><input id="a1-5" type="radio" name="a1" /><span>5</span></label>
            <label class="digit-proxy digit-proxy--a2"><input id="a2-5" type="radio" name="a2" /><span>5</span></label>
            <label class="digit-proxy digit-proxy--a3"><input id="a3-5" type="radio" name="a3" /><span>5</span></label>
            <label class="digit-proxy digit-proxy--b1"><input id="b1-5" type="radio" name="b1" /><span>5</span></label>
            <label class="digit-proxy digit-proxy--b2"><input id="b2-5" type="radio" name="b2" /><span>5</span></label>
            <label class="digit-proxy digit-proxy--b3"><input id="b3-5" type="radio" name="b3" /><span>5</span></label>
          </div>
          <div class="digit-key">
            <label class="digit-proxy digit-proxy--a1"><input id="a1-6" type="radio" name="a1" /><span>6</span></label>
            <label class="digit-proxy digit-proxy--a2"><input id="a2-6" type="radio" name="a2" /><span>6</span></label>
            <label class="digit-proxy digit-proxy--a3"><input id="a3-6" type="radio" name="a3" /><span>6</span></label>
            <label class="digit-proxy digit-proxy--b1"><input id="b1-6" type="radio" name="b1" /><span>6</span></label>
            <label class="digit-proxy digit-proxy--b2"><input id="b2-6" type="radio" name="b2" /><span>6</span></label>
            <label class="digit-proxy digit-proxy--b3"><input id="b3-6" type="radio" name="b3" /><span>6</span></label>
          </div>

          <div class="digit-key">
            <label class="digit-proxy digit-proxy--a1"><input id="a1-1" type="radio" name="a1" /><span>1</span></label>
            <label class="digit-proxy digit-proxy--a2"><input id="a2-1" type="radio" name="a2" /><span>1</span></label>
            <label class="digit-proxy digit-proxy--a3"><input id="a3-1" type="radio" name="a3" /><span>1</span></label>
            <label class="digit-proxy digit-proxy--b1"><input id="b1-1" type="radio" name="b1" /><span>1</span></label>
            <label class="digit-proxy digit-proxy--b2"><input id="b2-1" type="radio" name="b2" /><span>1</span></label>
            <label class="digit-proxy digit-proxy--b3"><input id="b3-1" type="radio" name="b3" /><span>1</span></label>
          </div>
          <div class="digit-key">
            <label class="digit-proxy digit-proxy--a1"><input id="a1-2" type="radio" name="a1" /><span>2</span></label>
            <label class="digit-proxy digit-proxy--a2"><input id="a2-2" type="radio" name="a2" /><span>2</span></label>
            <label class="digit-proxy digit-proxy--a3"><input id="a3-2" type="radio" name="a3" /><span>2</span></label>
            <label class="digit-proxy digit-proxy--b1"><input id="b1-2" type="radio" name="b1" /><span>2</span></label>
            <label class="digit-proxy digit-proxy--b2"><input id="b2-2" type="radio" name="b2" /><span>2</span></label>
            <label class="digit-proxy digit-proxy--b3"><input id="b3-2" type="radio" name="b3" /><span>2</span></label>
          </div>
          <div class="digit-key">
            <label class="digit-proxy digit-proxy--a1"><input id="a1-3" type="radio" name="a1" /><span>3</span></label>
            <label class="digit-proxy digit-proxy--a2"><input id="a2-3" type="radio" name="a2" /><span>3</span></label>
            <label class="digit-proxy digit-proxy--a3"><input id="a3-3" type="radio" name="a3" /><span>3</span></label>
            <label class="digit-proxy digit-proxy--b1"><input id="b1-3" type="radio" name="b1" /><span>3</span></label>
            <label class="digit-proxy digit-proxy--b2"><input id="b2-3" type="radio" name="b2" /><span>3</span></label>
            <label class="digit-proxy digit-proxy--b3"><input id="b3-3" type="radio" name="b3" /><span>3</span></label>
          </div>

          <button class="clear-key" type="reset">AC</button>
          <div class="digit-key">
            <label class="digit-proxy digit-proxy--a1"><input id="a1-0" type="radio" name="a1" /><span>0</span></label>
            <label class="digit-proxy digit-proxy--a2"><input id="a2-0" type="radio" name="a2" /><span>0</span></label>
            <label class="digit-proxy digit-proxy--a3"><input id="a3-0" type="radio" name="a3" /><span>0</span></label>
            <label class="digit-proxy digit-proxy--b1"><input id="b1-0" type="radio" name="b1" /><span>0</span></label>
            <label class="digit-proxy digit-proxy--b2"><input id="b2-0" type="radio" name="b2" /><span>0</span></label>
            <label class="digit-proxy digit-proxy--b3"><input id="b3-0" type="radio" name="b3" /><span>0</span></label>
          </div>
          <label class="equals-key">
            <input id="mode-result" type="radio" name="mode" />
            <span><b>=</b><small>MOUSE HERE</small></span>
          </label>
        </div>

        <div class="operator-pad">
          <label class="operator-key">
            <input id="op-add" type="radio" name="operator" />
            <span>+</span>
          </label>
          <label class="operator-key">
            <input id="op-subtract" type="radio" name="operator" />
            <span>-</span>
          </label>
          <label class="operator-key">
            <input id="op-multiply" type="radio" name="operator" />
            <span>*</span>
          </label>
          <label class="operator-key">
            <input id="op-divide" type="radio" name="operator" />
            <span>/</span>
          </label>
        </div>
      </section>
    </form>
  </main>
</body>
</html>
